<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臻臻的生日禮物集資</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#7F3025; --card:#44201C; --cream:#F6EBD3; --sub:#DCC7A8; --shade:#2B100D; --honey:#EBB56C; --blush:#E9A0A0;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 60px}
.box{background:var(--card);border-radius:26px;box-shadow:0 7px 0 var(--shade)}
header.hero{text-align:center;padding:8px 0 4px}
header.hero svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
h1{font-size:clamp(30px,7vw,48px);margin:16px 0 4px;line-height:1.25;font-weight:400}
.lead{margin:0 auto;max-width:34em;color:var(--sub);font-size:17px}
.total{margin:26px 0 34px;padding:18px 22px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.total b{font-size:26px;font-weight:400}
.bar{position:relative;height:24px;margin-top:10px;background:var(--shade);border-radius:20px}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:20px;transition:width .9s cubic-bezier(.2,.8,.2,1);
  background:repeating-linear-gradient(-45deg,var(--cream) 0 12px,#EADAB8 12px 24px)}
.fill.ski{background:repeating-linear-gradient(-45deg,var(--honey) 0 12px,#F2C98B 12px 24px)}
.fill::after{content:"❄";position:absolute;right:-8px;top:-5px;width:34px;height:34px;border-radius:50%;background:var(--bg);border:3px solid var(--cream);
  font-size:15px;line-height:28px;text-align:center;color:var(--cream)}
.fill[data-z="1"]::after{display:none}
.fill.g{background:none}
.segs{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:20px}
.seg{min-width:3px;border:0;border-right:2px solid var(--shade);padding:0;cursor:pointer;font:inherit;font-size:13px;line-height:24px;text-align:center;overflow:hidden;color:var(--card);transition:filter .2s}
.seg:last-child{border-right:0}
.seg:hover,.seg:focus-visible,.seg.on{filter:brightness(1.1) saturate(1.2);outline:0}
.seg.on,.seg:focus-visible{box-shadow:inset 0 0 0 2px var(--card)}
.c0{background:#F6EBD3}.c1{background:#EBB56C}.c2{background:#E9A0A0}.c3{background:#B7DCCB}.c4{background:#CFE3E6}.c5{background:#E7D3EE}
.who{min-height:3.4em;margin-top:12px;padding:8px 14px;background:var(--shade);border-radius:14px;font-size:15px;color:var(--sub)}
.who b{color:var(--cream);font-weight:400}
h2{font-size:24px;font-weight:400;margin:0 0 6px}
.gifts{display:grid;gap:34px}
.gift{overflow:hidden}
.gift .art{display:block;width:100%;height:auto}
.gift .body{padding:20px 22px 24px}
.price{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:var(--sub);margin-bottom:10px}
.price b{color:var(--cream);font-weight:400;font-size:20px}
.stat{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0 0;font-size:15px}
.stamp{display:none;margin:14px 0 0;padding:6px 14px;border:3px dashed var(--honey);color:var(--honey);border-radius:14px;transform:rotate(-2deg);width:fit-content}
.done .stamp{display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 12px}
button,input{font:inherit;color:var(--cream)}
.chip{cursor:pointer;background:transparent;border:2px solid var(--cream);border-radius:999px;padding:3px 16px}
.chip:hover{background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--card)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form input{width:100%;padding:9px 14px;background:var(--shade);border:2px solid transparent;border-radius:16px}
.form input::placeholder{color:var(--sub);opacity:.8}
.form input:focus{border-color:var(--cream);outline:0}
.form .full{grid-column:1/-1}
.go{cursor:pointer;margin-top:14px;width:100%;padding:11px 16px;font-size:18px;background:var(--bg);border:2px solid var(--cream);border-radius:999px;box-shadow:0 5px 0 var(--shade)}
.go:hover{background:#8F392C}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shade)}
:focus-visible{outline:3px solid var(--honey);outline-offset:3px}
.wall{margin-top:44px;padding:20px 22px}
.wall ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.wall li{display:flex;gap:12px;align-items:flex-start;padding-bottom:10px;border-bottom:2px dotted #6b3a31}
.wall li:last-child{border:0}
.dot{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--cream);color:var(--card)}
.wall small{color:var(--sub)}
.note{text-align:center;color:var(--sub);font-size:14px;margin-top:28px}
.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.03)}}
.drift{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}.pop,.drift{animation:none}}
@media (max-width:520px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bear" viewBox="0 0 100 120">
    <ellipse cx="50" cy="98" rx="31" ry="22" fill="#FFFFFF" stroke="#D2BFA2" stroke-width="2"/>
    <ellipse cx="50" cy="104" rx="19" ry="14" fill="#F1E6D2"/>
    <circle cx="24" cy="26" r="12" fill="#FFFFFF" stroke="#D2BFA2" stroke-width="2"/><circle cx="76" cy="26" r="12" fill="#FFFFFF" stroke="#D2BFA2" stroke-width="2"/>
    <circle cx="24" cy="26" r="6" fill="#E9C9BE"/><circle cx="76" cy="26" r="6" fill="#E9C9BE"/>
    <circle cx="50" cy="52" r="37" fill="#FFFFFF" stroke="#D2BFA2" stroke-width="2"/>
    
    <ellipse cx="50" cy="65" rx="17" ry="12.5" fill="#EFE2CB"/>
    <ellipse cx="50" cy="59" rx="6" ry="4" fill="#2B100D"/>
    <path d="M45 68 Q50 73 55 68" fill="none" stroke="#2B100D" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="49" r="3.4" fill="#2B100D"/><circle cx="65" cy="49" r="3.4" fill="#2B100D"/>
    <circle cx="27" cy="60" r="5" fill="#E9A0A0" opacity=".6"/><circle cx="73" cy="60" r="5" fill="#E9A0A0" opacity=".6"/>
    <path d="M22 84 Q50 98 78 84 L80 95 Q50 109 20 95Z" fill="#E8705F"/>
    <rect x="62" y="90" width="12" height="26" rx="5" fill="#E8705F"/>
  </symbol>
</svg>
<div class="wrap">

<header class="hero">
<svg viewBox="0 0 560 260" role="img" aria-label="戴紅圍巾的北極熊臻臻站在北海道流冰上,背後有極光">
  <rect width="560" height="260" rx="26" fill="#CFE3E6"/>
  <path d="M0 80 Q100 20 200 64 T400 54 T560 44 V0 H0Z" fill="#B7DCCB"/>
  <path d="M0 100 Q130 56 250 94 T560 72 V56 Q440 76 320 50 T0 62Z" fill="#E7D3EE" opacity=".8"/>
  <circle cx="470" cy="66" r="24" fill="#F6EBD3"/>
  <path d="M0 160 L80 108 L130 146 L200 92 L280 160Z" fill="#F6EBD3"/>
  <path d="M200 92 L176 116 L194 112 L202 124 L214 110 L226 116Z" fill="#CFE3E6"/>
  <rect y="160" width="560" height="100" fill="#8CBFCB"/>
  <g class="drift" fill="#F6EBD3"><ellipse cx="100" cy="212" rx="72" ry="15"/><ellipse cx="460" cy="198" rx="62" ry="13"/><ellipse cx="350" cy="240" rx="52" ry="10"/></g>
  <ellipse cx="280" cy="216" rx="92" ry="18" fill="#F6EBD3"/>
  <use href="#bear" x="222" y="104" width="116" height="139"/>
  <g fill="#F6EBD3"><circle cx="60" cy="40" r="3"/><circle cx="520" cy="130" r="3"/><circle cx="150" cy="70" r="2"/></g>
</svg>
<h1>臻臻,生日快樂!</h1>
<p class="lead">這個冬天,我們想一起送你兩份禮物:去看會漂的海冰,再學會從雪坡上滑下來。每一份心意都會讓進度條往前走一點。</p>
</header>

<section class="total box" aria-live="polite">
  <div class="row"><span>全部禮物集資進度</span><b id="tAmt">$0</b></div>
  <div class="bar" role="progressbar" aria-label="全部禮物集資進度" aria-valuemin="0" aria-valuemax="100" id="tBar"><div class="fill" id="tFill"></div></div>
  <div class="stat"><span id="tPct">0%</span><span id="tLeft"></span></div>
</section>

<main class="gifts" id="gifts"></main>

<section class="wall box">
  <h2>最新的心意</h2>
  <ul id="wall"></ul>
</section>
<p class="note">這是示範頁面,不會真的收款。資料只存在你的瀏覽器裡。</p>
</div>

<script>
const GIFTS=[
 {id:"ice",title:"北海道流冰漫步 5 日",goal:66900,cls:"",seed:[["小安",2000,"帶上我的份,去看海!","3 天前"],["阿哲",5000,"記得拍很多照片","3 天前"],["小美",3000,"","2 天前"],["大雄",1500,"","2 天前"],["匿名好友",2000,"","昨天"],["阿宇",10000,"生日快樂!","昨天"]],
  desc:"穿上乾式防寒衣,走在鄂霍次克海的流冰上,看冰塊在腳邊慢慢漂。",
  art:'<svg class="art" viewBox="0 0 600 200" role="img" aria-label="小熊站在流冰上看極光"><rect width="600" height="200" fill="#CFE3E6"/><path d="M0 64 Q110 12 210 54 T420 44 T600 34 V0H0Z" fill="#B7DCCB"/><path d="M0 92 Q140 46 270 86 T600 66 V46 Q470 66 340 40 T0 52Z" fill="#E7D3EE" opacity=".8"/><circle cx="520" cy="52" r="20" fill="#F6EBD3"/><rect y="124" width="600" height="76" fill="#8CBFCB"/><g fill="#F6EBD3"><ellipse class="drift" cx="120" cy="160" rx="72" ry="14"/><ellipse cx="470" cy="172" rx="62" ry="12"/><ellipse class="drift" cx="560" cy="146" rx="40" ry="9"/></g><ellipse cx="300" cy="160" rx="96" ry="17" fill="#F6EBD3"/><use href="#bear" x="248" y="52" width="104" height="125"/></svg>'},
 {id:"ski",title:"滑雪課程",goal:45000,cls:"ski",seed:[["小柔",6000,"一定要學會剎車","3 天前"],["Ken",8000,"","3 天前"],["琳琳",5000,"加油!","2 天前"],["老王",8000,"","2 天前"],["匿名好友",1000,"別摔太慘喔","昨天"],["阿宇",3000,"生日快樂!","昨天"]],
  desc:"請教練從零開始教,目標是這季結束前,可以帥氣滑完一條綠線。",
  art:'<svg class="art" viewBox="0 0 600 200" role="img" aria-label="小熊在雪坡上滑雪"><rect width="600" height="200" fill="#E9DDD0"/><circle cx="90" cy="44" r="20" fill="#F6EBD3"/><path d="M0 200 V128 L160 54 L270 128 L390 38 L600 160 V200Z" fill="#F6EBD3"/><path d="M390 38 L344 84 L372 80 L390 98 L408 78 L436 86Z" fill="#CFE3E6"/><path d="M0 200 V160 Q200 140 380 176 T600 188 V200Z" fill="#E4D6BC"/><path d="M40 176 L66 134 L88 160 L108 120 L132 176Z" fill="#8FA98B"/><path d="M510 190 L534 148 L554 172 L574 136 L594 190Z" fill="#8FA98B"/><g transform="rotate(-14 330 120)"><use href="#bear" x="278" y="42" width="104" height="125"/><rect x="262" y="164" width="140" height="8" rx="4" fill="#7F3025"/></g></svg>'}
];
const KEY="zhenzhen-bday-v2", fmt=n=>"$"+n.toLocaleString("en-US");
let seq=0;GIFTS.forEach(g=>{g.d=g.seed.map(s=>({id:++seq,n:s[0],a:s[1],m:s[2],t:s[3]}));g.raised=g.d.reduce((x,y)=>x+y.a,0)});

try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.d){GIFTS.forEach(g=>{if(Array.isArray(s.d[g.id])){g.d=s.d[g.id].filter(x=>x&&x.a>0);g.raised=g.d.reduce((x,y)=>x+y.a,0)}});seq=Math.max(seq,s.q||0)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({q:seq,d:Object.fromEntries(GIFTS.map(g=>[g.id,g.d]))}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function build(){
  $("#gifts").innerHTML=GIFTS.map(g=>`
  <article class="gift box" id="g-${g.id}">
    ${g.art}
    <div class="body">
      <h2>${g.title}</h2>
      <div class="price"><span>${g.desc}</span><b>目標 ${fmt(g.goal)}</b></div>
      <div class="bar" role="progressbar" aria-label="${g.title}進度" aria-valuemin="0" aria-valuemax="100"><div class="fill g" id="f-${g.id}"><div class="segs" id="sg-${g.id}"></div></div></div>
      <div class="stat"><span id="r-${g.id}"></span><span id="p-${g.id}"></span></div>
      <div class="who" id="w-${g.id}" aria-live="polite"></div>
      <div class="stamp" id="s-${g.id}">已達標!謝謝大家</div>
      <div class="chips" role="group" aria-label="選擇金額">
        ${[500,1000,2000,5000].map((a,i)=>`<button type="button" class="chip" data-g="${g.id}" data-a="${a}" aria-pressed="${i==1}">${fmt(a)}</button>`).join("")}
      </div>
      <div class="form">
        <input class="full" id="a-${g.id}" type="number" inputmode="numeric" min="1" step="1" value="1000" aria-label="自訂金額(元)">
        <input id="n-${g.id}" type="text" maxlength="12" placeholder="你的名字(可留空)" aria-label="你的名字">
        <input id="m-${g.id}" type="text" maxlength="30" placeholder="給臻臻一句話" aria-label="給臻臻的留言">
      </div>
      <button type="button" class="go" data-g="${g.id}">送出心意給這份禮物</button>
    </div>
  </article>`).join("");
}
function paint(){
  let tr=0,tg=0;
  GIFTS.forEach(g=>{
    tr+=g.raised;tg+=g.goal;
    const p=Math.min(100,g.raised/g.goal*100), f=$("#f-"+g.id);
    f.style.width=p+"%"; f.dataset.z=p<=0?1:0;
    const sg=$("#sg-"+g.id), bw=f.parentElement.clientWidth*p/100, tot=g.raised||1;
    sg.innerHTML=g.d.map((x,i)=>`<button type="button" class="seg c${i%6}" style="flex:${x.a}" data-g="${g.id}" data-i="${i}" title="${esc(x.n)} ${fmt(x.a)}" aria-label="${esc(x.n)} 捐了 ${fmt(x.a)}">${bw*x.a/tot>=26?esc(x.n).slice(0,1):""}</button>`).join("");
    const wh=$("#w-"+g.id); if(!wh.dataset.set) wh.textContent="點一下彩色區塊,看看是誰送來的心意";
    f.parentElement.setAttribute("aria-valuenow",Math.round(p));
    $("#r-"+g.id).textContent="已集 "+fmt(g.raised);
    const left=g.goal-g.raised;
    $("#p-"+g.id).textContent=left>0?`${Math.floor(p)}%・還差 ${fmt(left)}`:"100%・超過目標 "+fmt(-left);
    $("#g-"+g.id).classList.toggle("done",left<=0);
  });
  const tp=Math.min(100,tr/tg*100);
  $("#tAmt").textContent=fmt(tr)+" / "+fmt(tg);
  $("#tFill").style.width=tp+"%"; $("#tFill").dataset.z=tp<=0?1:0;
  $("#tBar").setAttribute("aria-valuenow",Math.round(tp));
  $("#tPct").textContent=Math.floor(tp)+"%";
  $("#tLeft").textContent=tg>tr?"還差 "+fmt(tg-tr):"全部達標!";
  $("#wall").innerHTML=GIFTS.flatMap(g=>g.d.map(x=>({...x,g:g.id}))).sort((a,b)=>b.id-a.id).slice(0,8).map(w=>{
    const g=GIFTS.find(x=>x.id===w.g);
    return `<li><span class="dot" aria-hidden="true">${esc(w.n).slice(0,1)||"友"}</span><div><b style="font-weight:400">${esc(w.n)}</b> 捐了 ${fmt(w.a)} 給「${g.title}」<br>${w.m?esc(w.m)+" ":""}<small>${w.t}</small></div></li>`}).join("");
}
document.addEventListener("click",e=>{
  const sgm=e.target.closest(".seg");if(sgm){showWho(sgm.dataset.g,+sgm.dataset.i);return}
  const c=e.target.closest(".chip");
  if(c){
    document.querySelectorAll(`.chip[data-g="${c.dataset.g}"]`).forEach(x=>x.setAttribute("aria-pressed",x===c));
    $("#a-"+c.dataset.g).value=c.dataset.a; return;
  }
  const b=e.target.closest(".go");
  if(b){
    const id=b.dataset.g, g=GIFTS.find(x=>x.id===id), inp=$("#a-"+id);
    const a=Math.floor(Number(inp.value));
    if(!(a>0)){inp.focus();b.textContent="請先輸入大於 0 的金額";setTimeout(()=>b.textContent="送出心意給這份禮物",1800);return}
    g.raised+=a;
    g.d.push({id:++seq,n:$("#n-"+id).value.trim()||"匿名好友",a,m:$("#m-"+id).value.trim(),t:"剛剛"});
    $("#n-"+id).value="";$("#m-"+id).value="";
    save();paint();showWho(id,g.d.length-1);
    const card=$("#g-"+id);card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");
    b.textContent="收到了,謝謝你!";setTimeout(()=>b.textContent="送出心意給這份禮物",1800);
  }
});
function showWho(id,i){const g=GIFTS.find(x=>x.id===id),x=g&&g.d[i];if(!x)return;
  document.querySelectorAll(`#sg-${id} .seg`).forEach((s,k)=>s.classList.toggle("on",k===i));
  const w=$("#w-"+id);w.dataset.set=1;
  w.innerHTML=`<b>${esc(x.n)}</b> 捐了 ${fmt(x.a)},占這份禮物的 ${(x.a/g.goal*100).toFixed(1)}%${x.m?`<br>「${esc(x.m)}」`:""}`}
document.addEventListener("pointerover",e=>{const s=e.target.closest(".seg");if(s&&e.pointerType==="mouse")showWho(s.dataset.g,+s.dataset.i)});
document.addEventListener("focusin",e=>{const s=e.target.closest(".seg");if(s)showWho(s.dataset.g,+s.dataset.i)});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(paint,200)});
build();paint();
</script>
</body>
</html>
